<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="boardFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="boardSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCE4EE" stop-opacity="0.96" />
      <stop offset="55%" stop-color="#CBD5E1" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.90" />
    </linearGradient>
    <linearGradient id="boardSheen" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="paperNote" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
  </defs>
  <!-- Ambient wall shadow -->
  <rect x="6" y="7" width="392" height="186" rx="5" fill="#020617" fill-opacity="0.45" />
  <!-- Anodized slate frame with top rim highlight -->
  <rect x="4" y="4" width="392" height="184" rx="4" fill="url(#boardFrame)" stroke="#090D16" stroke-width="3.5" />
  <line x1="6" y1="6" x2="394" y2="6" stroke="#64748B" stroke-width="1.2" stroke-opacity="0.7" />
  <!-- Writing surface + inner recessed shadow -->
  <rect x="12" y="12" width="376" height="168" rx="2" fill="url(#boardSurface)" stroke="#334155" stroke-width="1.8" />
  <line x1="13" y1="14" x2="387" y2="14" stroke="#0F172A" stroke-width="2" stroke-opacity="0.2" />
  <polygon points="12,12 178,12 104,180 12,180" fill="url(#boardSheen)" />
  <!-- Subtle horizontal erasure streaks -->
  <ellipse cx="290" cy="115" rx="68" ry="18" fill="#94A3B8" fill-opacity="0.16" />

  <!-- 7 Small Batch Portrait Cards (3 years ago) -->
  <g stroke="#0F172A" stroke-width="1.4">
    <rect x="28" y="23" width="38" height="48" rx="2" fill="url(#cardGrad)" />
    <rect x="78" y="23" width="38" height="48" rx="2" fill="url(#cardGrad)" />
    <rect x="128" y="23" width="38" height="48" rx="2" fill="#090D16" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="3,2" />
    <rect x="178" y="23" width="38" height="48" rx="2" fill="url(#cardGrad)" />
    <rect x="228" y="23" width="38" height="48" rx="2" fill="url(#cardGrad)" />
    <rect x="278" y="23" width="38" height="48" rx="2" fill="url(#cardGrad)" />
    <rect x="328" y="23" width="38" height="48" rx="2" fill="url(#cardGrad)" />
  </g>
  <!-- Top mounting tape/pins -->
  <g fill="#DC2626" fill-opacity="0.85">
    <circle cx="47" cy="24" r="2" />
    <circle cx="97" cy="24" r="2" />
    <circle cx="197" cy="24" r="2" />
    <circle cx="247" cy="24" r="2" />
    <circle cx="297" cy="24" r="2" />
    <circle cx="347" cy="24" r="2" />
  </g>
  <!-- Silhouettes inside mini cards with subtle shoulder lighting -->
  <g fill="#64748B">
    <circle cx="47" cy="39" r="6.8" /><path d="M36,64 Q47,49 58,64 Z" />
    <circle cx="97" cy="39" r="6.8" /><path d="M86,64 Q97,49 108,64 Z" />
    <circle cx="197" cy="39" r="6.8" /><path d="M186,64 Q197,49 208,64 Z" />
    <circle cx="247" cy="39" r="6.8" /><path d="M236,64 Q247,49 258,64 Z" />
    <circle cx="297" cy="39" r="6.8" /><path d="M286,64 Q297,49 308,64 Z" />
    <circle cx="347" cy="39" r="6.8" /><path d="M336,64 Q347,49 358,64 Z" />
  </g>
  <!-- Cipher sequence 4 - 1 - 7 - 2 - 6 - 3 - 5 -->
  <text x="200" y="117" text-anchor="middle" fill="#0F172A" font-family="JetBrains Mono, monospace" font-size="27" font-weight="700" letter-spacing="6">4-1-7-2-6-3-5</text>
  <!-- Handwritten note strip pinned below -->
  <rect x="94" y="133" width="216" height="32" rx="2" fill="#090D16" fill-opacity="0.22" />
  <rect x="92" y="131" width="216" height="32" rx="2" fill="url(#paperNote)" stroke="#92400E" stroke-width="1.2" />
  <circle cx="101" cy="137" r="2.2" fill="#DC2626" />
  <circle cx="299" cy="137" r="2.2" fill="#DC2626" />
  <line x1="114" y1="143" x2="284" y2="143" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="134" y1="153" x2="262" y2="153" stroke="#475569" stroke-width="1.4" stroke-linecap="round" />
  <!-- Brushed aluminum marker tray -->
  <rect x="0" y="185" width="400" height="11" rx="2" fill="url(#boardFrame)" stroke="#090D16" stroke-width="2" />
  <line x1="2" y1="186" x2="398" y2="186" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.5" />
  <rect x="50" y="180" width="28" height="5" rx="1.5" fill="#DC2626" stroke="#090D16" stroke-width="1" />
  <rect x="86" y="180" width="28" height="5" rx="1.5" fill="#0F172A" stroke="#090D16" stroke-width="1" />
  <rect x="310" y="179" width="38" height="6" rx="1" fill="#334155" stroke="#090D16" stroke-width="1" />
</svg>
