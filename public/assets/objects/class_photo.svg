<svg xmlns="http://www.w3.org/2000/svg" width="160" height="128" viewBox="0 0 160 128">
  <defs>
    <linearGradient id="seatWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4D3D33" />
      <stop offset="100%" stop-color="#29201A" />
    </linearGradient>
    <linearGradient id="photoPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>
  <!-- Contact shadow -->
  <ellipse cx="80" cy="121" rx="68" ry="6" fill="#020617" fill-opacity="0.65" />
  <!-- Steel Legs with subtle metallic highlight -->
  <line x1="28" y1="54" x2="26" y2="120" stroke="#64748B" stroke-width="6" stroke-linecap="round" />
  <line x1="132" y1="54" x2="134" y2="120" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <line x1="42" y1="54" x2="40" y2="112" stroke="#334155" stroke-width="5" stroke-linecap="round" />
  <line x1="118" y1="54" x2="120" y2="112" stroke="#1E293B" stroke-width="5" stroke-linecap="round" />
  <!-- Under-shelf -->
  <rect x="30" y="54" width="100" height="16" fill="#1E293B" stroke="#090D16" stroke-width="2.5" />
  <!-- Wooden Desk Top -->
  <polygon points="16,42 144,42 136,56 24,56" fill="url(#seatWood)" stroke="#090D16" stroke-width="3" />
  <line x1="18" y1="43" x2="142" y2="43" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.35" />
  <!-- Cut Class Photograph resting on top with lifted corner shadow -->
  <polygon points="57,38 107,36 103,48 53,50" fill="#020617" fill-opacity="0.35" />
  <polygon points="56,36 106,34 102,46 52,48" fill="url(#photoPaper)" stroke="#090D16" stroke-width="1.5" />
  <polygon points="73,37 82,37 81,45 72,45" fill="#090D16" stroke="#DC2626" stroke-width="1.1" />
</svg>
