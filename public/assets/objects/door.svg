<svg xmlns="http://www.w3.org/2000/svg" width="180" height="360" viewBox="0 0 180 360">
  <defs>
    <linearGradient id="steelDoor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#273549" />
      <stop offset="55%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="crimsonLed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="1" />
      <stop offset="45%" stop-color="#DC2626" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Door Frame -->
  <rect x="10" y="10" width="160" height="348" fill="#0F172A" stroke="#090D16" stroke-width="4" />
  <line x1="12" y1="12" x2="12" y2="356" stroke="#64748B" stroke-width="1.5" stroke-opacity="0.45" />
  <!-- Steel Door Leaf -->
  <rect x="22" y="22" width="136" height="334" fill="url(#steelDoor)" stroke="#090D16" stroke-width="3" />
  <!-- Subtle horizontal steel seam -->
  <line x1="25" y1="240" x2="155" y2="240" stroke="#090D16" stroke-width="1" stroke-opacity="0.4" />
  <!-- Narrow Frosted Glass Window -->
  <rect x="108" y="64" width="28" height="144" rx="2" fill="#334155" stroke="#090D16" stroke-width="2.5" />
  <rect x="112" y="68" width="20" height="136" fill="#94A3B8" fill-opacity="0.35" />
  <polygon points="112,68 132,68 112,126" fill="#E2E8F0" fill-opacity="0.16" />
  <!-- Handle & Electronic Lock Plate -->
  <rect x="36" y="182" width="16" height="44" rx="2" fill="#475569" stroke="#090D16" stroke-width="2" />
  <rect x="38" y="196" width="32" height="7" rx="2" fill="#CBD5E1" stroke="#090D16" stroke-width="1.5" />
  <!-- Crimson Lock LED + Soft Halo -->
  <circle cx="44" cy="189" r="9" fill="url(#crimsonLed)" />
  <circle cx="44" cy="189" r="3" fill="#FCA5A5" />
</svg>
